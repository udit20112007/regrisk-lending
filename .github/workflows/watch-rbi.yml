name: Watch RBI for new events

on:
  schedule:
    - cron: "15 3-17/2 * * *"   # every 2 hours, 08:45 to 22:45 India time
  workflow_dispatch:            # the "Run workflow" button on the Actions tab

permissions:
  contents: write               # to save new events back to the repository
  actions: write                # to start the deploy workflow

concurrency:
  group: watch-rbi
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Check RBI for new events
        id: watch
        run: python scripts/update_events.py

      - name: Save new events to the repository
        if: steps.watch.outputs.new_events == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.csv
          git commit -m "Add RBI event(s) found by the automatic watch"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Rebuild the website
        if: steps.watch.outputs.new_events == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: gh workflow run deploy.yml --ref "$BRANCH"
